<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Car cats style sample</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Style sample: a dark carbon backdrop, an intro title alone, then a header that swaps to each car's name,
     real car photos in skewed panels that arrive differently each time, one key number per car, the cat mascot
     (gato.webp) moving around the frame with meme captions, a centered visual-mode line, and a clean closing.
     Demo topic: 2024 Mazda MX-5 vs Toyota GR86 horsepower (US specs). */
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: italic; src: url("assets/fonts/barlow-condensed-800-italic.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("assets/fonts/barlow-condensed-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 500; src: url("assets/fonts/barlow-condensed-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; font-weight: 400; src: url("assets/fonts/anton-400-normal.woff2") format("woff2"); }
  body { margin: 0; background: #0b0b0e; font-family: "Barlow Condensed", sans-serif; }
  #root { --canvas: #0b0b0e; --ink: #f5f5f7; --muted: #8b8b96; --accent: #ff2d3d; --amber: #ffb020;
    position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink); background: var(--canvas); }
  .carbon { position: absolute; inset: 0; opacity: .5;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.35) 0 6px, transparent 6px 12px); }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(ellipse 75% 45% at 50% 50%, rgba(255,45,61,.5), rgba(180,18,31,.22) 45%, transparent 75%); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.75) 100%); }

  /* Intro: the title alone, centered, before any car appears. */
  .intro { position: absolute; left: 70px; right: 70px; top: 660px; text-align: center; }
  .intro h1 { margin: 0; font-size: 190px; font-weight: 800; font-style: italic; line-height: .88; text-transform: uppercase; }
  .intro h1 span { display: block; } .intro h1 em { color: var(--accent); font-style: italic; }

  /* Header: after the intro it carries the current car's name, nothing under it but the red rule. */
  .header { position: absolute; left: 70px; right: 70px; top: 150px; height: 140px; }
  .header h2 { position: absolute; left: 0; top: 0; margin: 0; font-size: 140px; font-weight: 800; font-style: italic;
    line-height: .9; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
  .header h2 em { color: var(--accent); font-style: italic; }
  .redline { position: absolute; left: 70px; top: 300px; width: 300px; height: 8px; background: var(--accent); transform: skewX(-20deg); }

  .panel { position: absolute; width: 940px; height: 400px; overflow: hidden; box-shadow: 0 30px 50px rgba(0,0,0,.6); }
  .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .panel::before { content: ""; position: absolute; top: 0; bottom: 0; width: 70px; background: var(--accent); z-index: 1; }
  .panel.lean-left { clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); }
  .panel.lean-left::before { left: 0; clip-path: polygon(0 0, 100% 0, 30% 100%, 0 100%); }
  .panel.lean-right { clip-path: polygon(0 0, 94% 0, 100% 100%, 6% 100%); }
  .panel.lean-right::before { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 70% 100%); }

  .stat { position: absolute; font-size: 170px; font-weight: 800; font-style: italic; line-height: 1; text-shadow: 0 6px 24px rgba(0,0,0,.7); }
  .stat small { font-size: 56px; color: var(--muted); margin-left: 8px; }
  .label { position: absolute; font-size: 46px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }

  .cat { position: absolute; width: 400px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.6)); }
  .meme { position: absolute; width: 520px; font-family: "Anton", sans-serif; color: #fff; text-transform: uppercase; text-align: center;
    -webkit-text-stroke: 6px #000; paint-order: stroke fill; letter-spacing: .01em; line-height: 1; font-size: 96px; }

  /* Words zone: centered across the full width, above the cat. */
  .line { position: absolute; left: 70px; right: 70px; bottom: 330px; z-index: 5; text-align: center; font-size: 66px; font-weight: 800; font-style: italic;
    text-transform: uppercase; -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 0 4px 16px rgba(0,0,0,.9); }
  .line em { font-style: italic; color: var(--accent); }

  .pass { position: absolute; left: 0; top: 760px; width: 1600px; height: 420px; transform: skewX(-24deg);
    background: linear-gradient(90deg, transparent, #b5121f 18%, #ff2d3d 50%, #b5121f 82%, transparent);
    box-shadow: 0 0 80px rgba(255,45,61,.6); }
  .pass::after { content: ""; position: absolute; left: 0; right: 0; top: 46%; height: 10px; background: rgba(255,255,255,.85); }

  /* Closing: alone on the backdrop, one big phrase and one line. */
  .closing { position: absolute; left: 70px; right: 70px; top: 720px; text-align: center; }
  .closing b { display: block; font-size: 240px; font-weight: 800; font-style: italic; color: var(--accent); line-height: .9; text-shadow: 0 0 60px rgba(255,45,61,.45); }
  .closing span { display: block; margin-top: 24px; font-size: 64px; font-weight: 800; font-style: italic; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="11">
  <div class="carbon"></div><div class="glow"></div><div class="vignette"></div>

  <div class="intro" id="intro"><h1><span>MX-5</span><span><em>vs</em> GR86</span></h1></div>

  <div class="header" id="header">
    <h2 id="nameA">Mazda <em>MX-5</em></h2>
    <h2 id="nameB">Toyota <em>GR86</em></h2>
  </div>
  <div class="redline" id="redline"></div>

  <!-- Car A: panel high, leans left, drives in from the left; number left, cat bottom right. -->
  <div class="panel lean-left" id="carA" style="left:70px; top:380px"><img src="assets/photos/mx5.webp" alt="Mazda MX-5" style="object-position: 50% 60%" /></div>
  <div class="stat" id="statA" style="left:70px; top:820px"><span id="hpA">0</span><small>HP</small></div>
  <div class="label" id="labelA" style="left:70px; top:1000px">Stock, 2024 US</div>

  <!-- Car B: panel lower, leans right, drops in from above; number right, cat bottom left. -->
  <div class="panel lean-right" id="carB" style="left:70px; top:520px"><img src="assets/photos/gr86.webp" alt="Toyota GR86" style="object-position: 50% 55%" /></div>
  <div class="stat" id="statB" style="right:70px; top:960px"><span id="hpB">0</span><small>HP</small></div>

  <img class="cat" id="cat" src="assets/photos/gato.webp" alt="" style="right:20px; top:1180px" />
  <div class="meme" id="memeA" style="right:-40px; top:1070px">Wait...</div>
  <div class="meme" id="memeB" style="left:-40px; top:1070px">+47 HP?!</div>

  <div class="line" id="lineA">Light and <em>simple</em></div>
  <div class="line" id="lineB">The GR86 <em>pulls ahead</em></div>

  <div class="pass" id="pass"></div>
  <div class="closing" id="closing"><b>+47 HP</b><span>GR86 over MX-5</span></div>
</div>
<script>
  // Motion values (see style.md): hard, fast entrances, a skid to settle, racing counters.
  const EASE = { drive: "expo.out", skid: "back.out(1.2)", exit: "power3.in", pop: "back.out(2)" };
  const DUR = { small: 0.3, medium: 0.5, drive: 0.7, count: 0.9 };

  // Model: 2024 US horsepower.
  const SPEC = { mx5: 181, gr86: 228 };
  const diff = SPEC.gr86 - SPEC.mx5; // 47

  const tl = gsap.timeline({ paused: true });
  gsap.set("#pass", { x: 1200 });
  gsap.set(["#header h2", "#redline", "#carA", "#statA", "#labelA", "#carB", "#statB", "#cat", "#memeA", "#memeB", "#lineA", "#lineB", "#closing"], { opacity: 0 });

  // Intro: the title alone on the backdrop, nothing else.
  tl.from("#intro h1 span", { opacity: 0, x: -140, skewX: -12, duration: DUR.medium, ease: EASE.drive, stagger: 0.12 }, 0.45);

  // Header swap: the intro speeds off, the first car's name slams into the header.
  const A = 1.9;
  tl.to("#intro", { x: -1300, filter: "blur(14px)", duration: 0.35, ease: EASE.exit }, A);
  tl.fromTo("#nameA", { opacity: 0, x: -120, skewX: -12 }, { opacity: 1, x: 0, skewX: 0, duration: DUR.medium, ease: EASE.drive }, A + 0.25);
  tl.fromTo("#redline", { opacity: 1, scaleX: 0, transformOrigin: "left center" }, { opacity: 1, scaleX: 1, duration: DUR.medium, ease: EASE.drive }, A + 0.35);

  // Car A drives in from the left and skids; its number counts up beside it.
  tl.fromTo("#carA", { opacity: 1, x: -1100 }, { opacity: 1, x: 0, duration: DUR.drive, ease: EASE.skid }, A + 0.4);
  tl.to("#statA", { opacity: 1, duration: 0.2 }, A + 1.0);
  for (let k = 1; k <= 12; k++) tl.set("#hpA", { textContent: String(Math.round(SPEC.mx5 * k / 12)) }, A + 1.0 + k * DUR.count / 12);
  tl.fromTo("#labelA", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: DUR.small, ease: EASE.drive }, A + 1.9);
  tl.fromTo("#lineA", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: DUR.small, ease: EASE.drive }, A + 1.2);

  // The cat rises from the bottom right, suspicious.
  tl.fromTo("#cat", { opacity: 1, y: 700 }, { opacity: 1, y: 0, duration: DUR.medium, ease: EASE.pop, immediateRender: false }, A + 2.1);
  tl.fromTo("#memeA", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: DUR.small, ease: EASE.pop }, A + 2.4);

  // Car B: everything of car A leaves upward, the header name swaps, car B drops in from above.
  const B = 5.4;
  tl.to(["#carA", "#statA", "#labelA"], { y: -1400, filter: "blur(12px)", duration: 0.35, ease: EASE.exit, stagger: 0.03 }, B);
  tl.to("#cat", { y: 700, duration: 0.3, ease: EASE.exit }, B);
  tl.to("#memeA", { opacity: 0, y: 200, duration: 0.25, ease: EASE.exit }, B);
  tl.to("#lineA", { opacity: 0, duration: 0.2 }, B);
  tl.to("#nameA", { opacity: 0, x: 200, duration: 0.25, ease: EASE.exit }, B + 0.05);
  tl.fromTo("#nameB", { opacity: 0, x: -120, skewX: -12 }, { opacity: 1, x: 0, skewX: 0, duration: DUR.medium, ease: EASE.drive }, B + 0.25);
  tl.fromTo("#carB", { opacity: 1, y: -1000, rotation: -3 }, { opacity: 1, y: 0, rotation: 0, duration: DUR.drive, ease: EASE.skid }, B + 0.3);
  tl.to("#statB", { opacity: 1, duration: 0.2 }, B + 0.9);
  for (let k = 1; k <= 12; k++) tl.set("#hpB", { textContent: String(Math.round(SPEC.gr86 * k / 12)) }, B + 0.9 + k * DUR.count / 12);
  tl.fromTo("#lineB", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: DUR.small, ease: EASE.drive }, B + 1.1);

  // The cat moves: it slams in big from the left this time, with the reaction.
  tl.set("#cat", { right: "auto", left: 20, y: 0, rotation: 0 }, B + 1.8);
  tl.fromTo("#cat", { scale: 0.4, rotation: -12, x: -300 }, { scale: 1, rotation: 0, x: 0, duration: DUR.medium, ease: EASE.pop, immediateRender: false }, B + 1.8);
  tl.fromTo("#memeB", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: DUR.small, ease: EASE.skid }, B + 1.95);

  // Race pass to the closing: everything clears, header included, and the closing skids in alone.
  const PASS = 8.8;
  tl.to(["#cat", "#memeB"], { opacity: 0, scale: 0.6, duration: 0.2, ease: EASE.exit }, PASS);
  tl.to(["#header", "#redline", "#carB"], { x: -1300, filter: "blur(14px)", duration: 0.35, ease: EASE.exit, stagger: 0.04 }, PASS + 0.05);
  tl.to(["#statB", "#lineB"], { x: 1300, filter: "blur(14px)", duration: 0.35, ease: EASE.exit, stagger: 0.04 }, PASS + 0.05);
  tl.fromTo("#pass", { x: 1200 }, { x: -1800, duration: 0.45, ease: "power2.inOut" }, PASS + 0.15);
  tl.fromTo("#closing", { opacity: 0, x: 900, skewX: -18, filter: "blur(10px)" },
    { opacity: 1, x: 0, skewX: 0, filter: "blur(0px)", duration: DUR.medium, ease: EASE.skid }, PASS + 0.4);
  window.__timelines.main = tl;
</script>
</body>
</html>
