<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Car cats thumbnail sample</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Static cover sample: title and hero inside the safe box (x 60–960, y 240–1400). */
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: italic; src: url("assets/fonts/barlow-condensed-800-italic.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; font-weight: 400; src: url("assets/fonts/anton-400-normal.woff2") format("woff2"); }
  body { margin: 0; background: #0b0b0e; font-family: "Barlow Condensed", sans-serif; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #f5f5f7; background: #0b0b0e; }
  .carbon { position: absolute; inset: 0; opacity: .5; background: repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 6px, transparent 6px 12px), repeating-linear-gradient(-45deg, rgba(0,0,0,.35) 0 6px, transparent 6px 12px); }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 45% at 50% 50%, rgba(255,45,61,.5), rgba(180,18,31,.22) 45%, transparent 75%); }
  h1 { position: absolute; left: 70px; right: 70px; top: 260px; margin: 0; font-size: 190px; font-weight: 800; font-style: italic; line-height: .88; text-transform: uppercase; }
  h1 span { display: block; } h1 em { color: #ff2d3d; font-style: italic; }
  .panel { position: absolute; left: 70px; width: 940px; height: 270px; overflow: hidden; clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); }
  .panel img { width: 100%; height: 100%; object-fit: cover; }
  .panel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 70px; background: #ff2d3d; clip-path: polygon(0 0, 100% 0, 30% 100%, 0 100%); z-index: 1; }
  .gato { position: absolute; right: 60px; top: 940px; width: 300px; filter: drop-shadow(0 20px 30px rgba(0,0,0,.7)); }
  .meme { position: absolute; right: 60px; top: 840px; font-family: "Anton", sans-serif; font-size: 120px; color: #fff; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
  <div class="carbon"></div><div class="glow"></div>
  <h1><span>MX-5</span><span><em>vs</em> GR86</span></h1>
  <div class="panel" style="top:660px"><img src="assets/photos/mx5.webp" alt="" style="object-position:50% 60%" /></div>
  <div class="panel" style="top:960px"><img src="assets/photos/gr86.webp" alt="" style="object-position:50% 55%" /></div>
  <img class="gato" src="assets/photos/gato.webp" alt="" />
  <div class="meme">+47 HP?!</div>
</div>
<script>window.__timelines.main = gsap.timeline({ paused: true });</script>
</body>
</html>
