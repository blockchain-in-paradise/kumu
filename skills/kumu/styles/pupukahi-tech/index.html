<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Pūpūkahi Tech style sample</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/characters/people.js"></script>
<style>
  /* Style sample: the ground, a headline, one proof object built from realistic parts (a glossy coin,
     a price ruler that names its value, drawn reserves on a lit shelf that feed the $1.00 peg), a caption with the current word highlighted, a
     titled opening, two drawn people with
     their own looks, an exchange with small copies of the coin and bill, measured dotted paths, the redemption lock, the fade under the header, and the closing card. Demo topic: why a dollar stablecoin stays at $1. */
  @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
  body { margin: 0; background: #0e394e; font-family: "Inter", sans-serif; }
  #root {
    --canvas: #0e394e; --ink: #fcfaf8; --on-highlight: #1d2930; --accent: #39a1ac;
    --highlight: #d19847; --panel: rgba(14,57,78,.72); --border: rgba(252,250,248,.22); --support-sunset: #ee7c2b;
    position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink);
  }
  .ground { position: absolute; inset: 0; overflow: hidden; background: var(--canvas); }
  .ground-photo { position: absolute; inset: 0; opacity: 0.15; background: url("assets/ground.webp") center / cover no-repeat; }
  .grain { position: absolute; inset: 0; opacity: 0.045; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
  .clip { position: absolute; inset: 0; }
  .headline { position: absolute; left: 92px; right: 92px; top: 200px; margin: 0;
    font-size: 104px; font-weight: 800; line-height: 0.92; letter-spacing: -0.04em; text-wrap: balance; }

  /* Realistic coin: gold radial body, ridged rim, inner ring, embossed label. */
  .mover { position: absolute; left: 420px; top: 470px; width: 240px; height: 350px; }
  .coin { position: absolute; left: 0; top: 110px; width: 240px; height: 240px; border-radius: 50%;
    background: repeating-conic-gradient(#b8860b 0 1.5deg, #e8bb3a 1.5deg 3deg);
    box-shadow: 0 24px 48px rgba(0,0,0,.4); }
  .coin::before { content: ""; position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fff4c8 0%, #f6cf55 22%, #dcaa2a 58%, #a87a14 100%); }
  .coin::after { content: ""; position: absolute; inset: 32px; border-radius: 50%; border: 5px solid rgba(110,72,0,.35);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .coin span { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1;
    font-size: 58px; font-weight: 800; letter-spacing: -0.02em; color: #6b4600; text-shadow: 0 2px 0 rgba(255,236,170,.6); }

  /* Price ruler the coin slides along. */
  .ruler { position: absolute; left: 220px; right: 220px; top: 900px; height: 4px; background: var(--border); }
  .tick { position: absolute; top: -14px; width: 4px; height: 32px; background: var(--border); }
  .tick b { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font-size: 40px; font-weight: 600; white-space: nowrap; }

  /* Reserve shelf: a lighter navy than the ground with a teal border, holding drawn reserves. */
  .shelf { position: absolute; left: 310px; right: 310px; top: 1070px; height: 270px; border-radius: 28px;
    background: linear-gradient(180deg, #1f6a80 0%, #175469 100%); border: 3px solid rgba(57,161,172,.9);
    box-shadow: 0 24px 48px rgba(0,0,0,.35), inset 0 2px 0 rgba(252,250,248,.12); }
  .shelf h4 { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; font-size: 40px; font-weight: 600; }
  .reserve { position: absolute; top: 22px; filter: drop-shadow(0 14px 18px rgba(0,0,0,.4)); }
  .flow, .mover { z-index: 2; }
  /* People: built by People.mount (see style.md, People and looks). */
  .person { position: absolute; top: 1090px; width: 164px; z-index: 3; text-align: center; }
  #customer { left: 92px; } #trader { left: 824px; }
  .person svg { display: block; width: 164px; height: 198px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.35)); }
  .person b { display: block; margin: 10px -20px 0; font-size: 40px; font-weight: 600; }
  /* Exchanged items are small copies of the scene's own coin and bill drawings. */
  .coin.mini { top: 0; width: 96px; height: 96px; z-index: 4; box-shadow: 0 10px 20px rgba(0,0,0,.4); }
  .coin.mini::before { inset: 4px; } .coin.mini::after { inset: 13px; border-width: 3px; } .coin.mini span { font-size: 21px; }
  .mini-bill { position: absolute; left: 0; top: 0; width: 150px; height: 72px; z-index: 4; overflow: visible;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  /* Failure: the paths stop and go grey, and this lock lands on the shelf's top edge. */
  .lock-row { position: absolute; left: 0; right: 0; top: 1038px; display: flex; justify-content: center; z-index: 5; }
  .lock { display: flex; align-items: center; gap: 14px; background: var(--support-sunset); color: var(--on-highlight);
    font-size: 40px; font-weight: 800; padding: 10px 28px; border-radius: 999px; white-space: nowrap; box-shadow: 0 12px 28px rgba(0,0,0,.4); }
  .lock svg { width: 40px; height: 40px; }
  .flow { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; overflow: visible; }
  .flow path { fill: none; stroke: #6fd0da; stroke-width: 11; stroke-linecap: round; stroke-dasharray: 3 19; filter: drop-shadow(0 0 8px rgba(57,161,172,.9)); }

  .caption { position: absolute; left: 92px; right: 92px; bottom: 340px; text-align: center;
    font-size: 52px; font-weight: 800; line-height: 1.2; }
  .caption span { padding: 0 8px; border-radius: 8px; }
  .cta-lockup { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0 60px; text-align: center; }
  .cta-kicker { color: var(--highlight); font-size: 45px; font-weight: 800; letter-spacing: 0.18em; }
  .cta-handle { margin: 30px 0 0; color: var(--ink); font-size: 82px; font-weight: 800; line-height: 1; letter-spacing: -0.06em; }
  .socials { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 48px; }
  .socials svg { display: block; width: 94px; height: 94px; flex: 0 0 94px; fill: var(--ink); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="10.4">
  <div class="ground"><div class="ground-photo"></div><div class="grain"></div></div>

  <section id="scene" class="clip" data-start="0" data-duration="8">
    <h1 class="headline" id="hl">Why Stablecoins Stay at $1</h1>
    <div class="ruler" id="ruler">

      <svg class="reserve" id="cash" viewBox="0 0 300 210" style="left:22px; width:210px">

        <g stroke="#4f7a4c" stroke-width="2">

        <circle cx="230" cy="98" r="16" fill="none" stroke="#5d8a59" stroke-width="2.5"/>
        <rect x="128" y="28" width="38" height="178" rx="4" fill="url(#band)" stroke="#a8996f" stroke-width="2"/>
      </svg>
      <!-- Treasury bill: cream certificate with a double border, seal, and printed lines. -->
      <svg class="reserve" id="bond" viewBox="0 0 280 210" style="right:22px; width:200px; transform: rotate(-4deg)">
        <defs>
          <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf5e3"/><stop offset="1" stop-color="#e3d6b2"/></linearGradient>
          <radialGradient id="seal" cx=".35" cy=".3"><stop offset="0" stop-color="#7fd3db"/><stop offset="1" stop-color="#196d76"/></radialGradient>
        </defs>
        <rect x="16" y="14" width="248" height="182" rx="6" fill="url(#paper)" stroke="#a8996f" stroke-width="2"/>
        <rect x="28" y="26" width="224" height="158" rx="3" fill="none" stroke="#8a7a4a" stroke-width="3"/>
        <rect x="35" y="33" width="210" height="144" rx="2" fill="none" stroke="#8a7a4a" stroke-width="1.5"/>
        <path d="M58 60 H222 M78 80 H202" stroke="#6f6440" stroke-width="5" stroke-linecap="round"/>
        <path d="M58 150 H150 M58 164 H130" stroke="#a89a70" stroke-width="3" stroke-linecap="round"/>
        <circle cx="198" cy="140" r="26" fill="url(#seal)" stroke="#145a62" stroke-width="2"/>
        <circle cx="198" cy="140" r="17" fill="none" stroke="#e8f6f7" stroke-width="2" stroke-dasharray="3 4"/>
      </svg>
    </div>
    <div class="person" id="customer"></div>
    <div class="person" id="trader"></div>
    <div class="coin mini" id="token"><span>USDC</span></div>
    <svg class="mini-bill" id="billToken" viewBox="12 34 268 128"><rect x="18" y="40" width="256" height="116" rx="8" fill="url(#bill)" stroke="#4f7a4c" stroke-width="2"/><rect x="30" y="52" width="232" height="92" rx="5" fill="none" stroke="#5d8a59" stroke-width="2.5"/><ellipse cx="146" cy="98" rx="30" ry="34" fill="#b7d3aa" stroke="#5d8a59" stroke-width="2.5"/><circle cx="62" cy="98" r="16" fill="none" stroke="#5d8a59" stroke-width="2.5"/><circle cx="230" cy="98" r="16" fill="none" stroke="#5d8a59" stroke-width="2.5"/></svg>
    <div class="lock-row"><div class="lock" id="lock"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><rect x="4" y="10" width="16" height="12" rx="3" fill="currentColor"/></svg>Redemption paused</div></div>
    <div class="caption" id="cap"><span id="w1">Traders</span> <span id="w2">pull</span> <span id="w3">it</span> <span id="w4">back</span> <span id="w5">to</span> <span id="w6">one.</span></div>
  </section>


  <section id="closing" class="clip" data-start="7.4" data-duration="3">
    <div class="cta-lockup">
      <div class="cta-kicker" id="kicker">FOLLOW</div>
      <h1 class="cta-handle" id="handle">@pupukahi_tech</h1>
      <div class="socials" id="socials" aria-label="tiktok, linkedin, instagram">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-tiktok" viewBox="0 0 16 16">

</svg><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-linkedin" viewBox="0 0 16 16">
  <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .694.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z"/>
</svg><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-instagram" viewBox="0 0 16 16">
  <path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233s.008-2.388.046-3.231c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92m-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217m0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334"/>
</svg>
      </div>
    </div>

</div>
<script>
  // Motion values for this style (see style.md).
  const ENTER = "power3.out", EXIT = "power3.in", MOVE = "power2.inOut", STAGGER = 0.08;
  // Model: the coin's x position on the ruler is its market price ($0.01 = 320 px).
  const priceX = (p) => (p - 1) * 32000;
  const tl = gsap.timeline({ paused: true });
  // Layout helpers. at(): a point on an element in 1080x1920 frame units (ax, ay from 0 to 1 across its box).
  // connect(): a dotted path from one point to another. to(): the x/y that centers a token on a point.
  // fit(): headline size, the largest 112-80 px that keeps one line, else the largest two balanced lines.
  const root = document.querySelector("#root");
  const at = (sel, ax = 0.5, ay = 0.5) => { const r = root.getBoundingClientRect(), k = r.width / 1080,
    b = document.querySelector(sel).getBoundingClientRect();
    return { x: (b.left - r.left + b.width * ax) / k, y: (b.top - r.top + b.height * ay) / k }; };
  const connect = (sel, a, b) => { const m = (a.y + b.y) / 2;
    document.querySelector(sel).setAttribute("d", `M${a.x} ${a.y} C${a.x} ${m} ${b.x} ${m} ${b.x} ${b.y}`); };
  const to = (sel, p) => { const k = root.getBoundingClientRect().width / 1080, b = document.querySelector(sel).getBoundingClientRect();
    return { x: p.x - b.width / k / 2, y: p.y - b.height / k / 2 }; };
  // Exchange: an item is pulled out at a point, carried to another, and taken in there. People never fade out mid-scene.
  const pull = (sel, p, t) => { tl.set(sel, { ...to(sel, p), scale: 0, opacity: 1 }, t); tl.to(sel, { scale: 1, duration: 0.25, ease: ENTER }, t); };
  const carry = (sel, p, t, d = 0.6) => tl.to(sel, { ...to(sel, p), duration: d, ease: MOVE }, t);
  const take = (sel, t) => tl.to(sel, { scale: 0, duration: 0.2, ease: EXIT }, t);
  // The ruler names the price after the opening: the tick under the coin lights up.
  const tick = (id, t, color = "#6fd0da") => { tl.set(["#t99", "#peg", "#t101"], { color: "#fcfaf8", fontWeight: 600 }, t);
    tl.set(id, { color, fontWeight: 800 }, t); };
  const fit = (t) => { const h = document.querySelector("#hl"), c = h.cloneNode(); c.textContent = t; h.after(c); let s = 112;
    c.style.cssText = "visibility:hidden;white-space:nowrap;right:auto";
    for (; s >= 80; s -= 2) { c.style.fontSize = s + "px"; if (c.offsetWidth <= h.clientWidth) break; }
    if (s < 80) { c.style.cssText = "visibility:hidden"; for (s = 112; s > 80; s -= 2) { c.style.fontSize = s + "px"; if (c.offsetHeight <= s * 0.92 * 2 + 2) break; } }
    c.remove(); return s; };
  // People (assets/characters/people.js): presets spread and overridden. Choose new looks for each video.
  People.mount("#customer", { ...People.LOOKS.saver, hair: "long", prop: "earrings" }, "Customer");
  People.mount("#trader", People.LOOKS.trader, "Trader");
  // Measure before any tween moves things: the reserves feed the $1.00 mark.
  const peg = at("#peg", 0.5, 1), coin = at("#mover .coin"), counter = at("#shelf", 0.5, 0.42), trader = at("#trader svg", 0.5, 0.72);
  connect("#flowL", at("#cash", 0.5, 0), peg);
  connect("#flowR", at("#bond", 0.5, 0), peg);
  // Opening: the title (sized after the font loads) and the coin are on screen from frame 0,
  // the coin large in the free space under the title (INTRO, scaled about the coin's center).
  const INTRO = { scale: 1.8, y: 230 };
  tl.set("#mover", { ...INTRO, transformOrigin: "120px 230px" }, 0);
  tl.set("#hl", { fontSize: () => fit("Why Stablecoins Stay at $1") }, 0);
  tl.set(["#ruler", "#shelf", "#cap", "#flow path", "#customer", "#trader", "#token", "#billToken", "#lock"], { opacity: 0 }, 0);
  // The ruler arrives and the coin scales to its diagram spot.
  tl.to("#ruler", { opacity: 1, duration: 0.6, ease: ENTER }, 1.0);
  tl.to("#mover", { scale: 1, y: 0, duration: 0.6, ease: MOVE }, 0.6);
  tick("#peg", 1.0);
  // State 1: the reserves arrive and the people walk up to the counter and stay.
  tl.fromTo("#shelf", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER }, 1.0);
  tl.from(["#cash", "#bond"], { y: 30, opacity: 0, duration: 0.5, ease: ENTER, stagger: STAGGER }, 1.2);
  tl.fromTo("#customer", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, 1.4);
  tl.fromTo("#trader", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, 1.48);
  // State 2: selling drags the price down to $0.99.
  tl.to("#mover", { x: priceX(0.99), duration: 0.8, ease: MOVE }, 1.9);
  tick("#t99", 2.3);
  // State 3: the trader buys the cheap coin and redeems it for a dollar; the reserves pulse and flow
  // into the $1.00 mark, and the price returns.
  pull("#token", { x: coin.x + priceX(0.99), y: coin.y }, 2.5); carry("#token", trader, 2.75, 0.6);
  carry("#token", counter, 3.4, 0.5); take("#token", 3.9);
  pull("#billToken", counter, 4.0); carry("#billToken", trader, 4.2, 0.5); take("#billToken", 4.9);
  tl.to(["#cash", "#bond"], { scale: 1.08, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.1 }, 3.0);
  tl.to("#flow path", { opacity: 1, duration: 0.2 }, 3.0);
  tl.fromTo("#flow path", { strokeDashoffset: 0 }, { strokeDashoffset: -220, duration: 2.6, ease: "none" }, 3.0);
  tl.to("#mover", { x: priceX(1.00), duration: 0.8, ease: MOVE }, 3.5);
  tick("#peg", 3.9);
  tl.fromTo("#cap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.3);
  [[3.4, 3.8], [3.8, 4.0], [4.0, 4.15], [4.15, 4.45], [4.45, 4.6], [4.6, 5.1]].forEach(([s, e], i) => {
    tl.set(`#w${i + 1}`, { backgroundColor: "#d19847", color: "#1d2930" }, s);
    tl.set(`#w${i + 1}`, { backgroundColor: "rgba(0,0,0,0)", color: "#fcfaf8" }, e);
  });
  // The answer: the diagram fades and the coin returns to its opening size and spot.
  tl.to(["#ruler", "#flow", "#shelf", "#customer", "#trader"], { opacity: 0, duration: 0.6, ease: EXIT }, 5.2);
  tl.set("#mover", { zIndex: 6 }, 5.2);
  tl.to("#mover", { ...INTRO, duration: 0.8, ease: MOVE }, 5.2);
  // Closing: the coin and caption fade, the header holds, then leaves with the left push.
  tl.to(["#mover", "#cap"], { opacity: 0, duration: 0.6, ease: EXIT }, 6.4);
  tl.to("#hl", { x: -1080, duration: 0.6, ease: EXIT }, 7.4);
  tl.from("#closing .cta-lockup", { x: 1080, duration: 0.6, ease: EXIT }, 7.4);
  // Closing card entry.
  tl.fromTo("#kicker", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, 7.7);
  tl.fromTo("#handle", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "power4.out" }, 7.88);
  tl.fromTo("#socials svg", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.48, ease: ENTER, stagger: 0.1 }, 8.38);
  window.__timelines.main = tl;
