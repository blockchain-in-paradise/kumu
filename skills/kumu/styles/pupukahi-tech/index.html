  tl.fromTo("#cash", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER, immediateRender: false }, ws("cash"));
  tl.fromTo("#firm", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER, immediateRender: false }, ws("approved firms"));
  tl.to("#slot", { backgroundColor: "#196d76", duration: 0.3, ease: ENTER, yoyo: true, repeat: 1, repeatDelay: 0.6 }, ws("trade one coin"));

  // 2: the market. The ruler arrives and the coin settles on $1.00, then drifts to $0.99.
  tl.fromTo("#ruler", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: ENTER, immediateRender: false }, ws("everyone else"));
  tl.to("#coin", { scale: 1, x: priceX(1.0), y: 0, duration: 0.8, ease: MOVE }, ws("everyone else"));
  tick(1.0, ws("everyone else", 0.6));
  price(0.99, ws("drift"));

  // 3: below a dollar. The firm buys a coin at $0.99, swaps it at the safe for a dollar, and the price lifts.
  pull("#mini", coinAt(0.99), ws("buys coins")); carry("#mini", firmHand, ws("buys coins", 0.2), 0.7);
  // The swap: the coin goes into the slot while the dollar comes out to the firm, at the same time.
  pull("#bill", slot, ws("swaps")); carry("#mini", slot, ws("swaps", 0.2), 0.8); carry("#bill", firmHand, ws("swaps", 0.2), 0.8);
  take("#mini", ws("swaps", 1.0)); take("#bill", ws("lifts", 0.4));
  price(1.0, ws("lifts"));

  // 4: above a dollar. The firm hands the safe a dollar, gets a new coin, and sells it; the price comes back down.
  price(1.01, ws("above"));
  pull("#bill", firmHand, ws("firms get"));
  pull("#mini", slot, ws("from the issuer", -0.3)); carry("#bill", slot, ws("from the issuer", -0.1), 0.8); carry("#mini", firmHand, ws("from the issuer", -0.1), 0.8);
  take("#bill", ws("from the issuer", 0.7));
  carry("#mini", coinAt(1.01), ws("sell them"), 0.7); take("#mini", ws("sell them", 0.7));
  price(1.0, ws("pulls"));

  // 5: the limit. The safe's cash and slot are what make it work; if redemption pauses, the price can stay low.
  tl.to(["#cash", "#safe"], { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.1 }, ws("reserves"));
  tl.to("#slot", { backgroundColor: "#39a1ac", duration: 0.3, ease: ENTER }, ws("redemption"));
  tl.set("#slot", { backgroundColor: "#0b161b" }, ws("if it pauses"));
  tl.to(["#sobj", "#cash"], { filter: "grayscale(1) brightness(.75)", duration: 0.4 }, ws("if it pauses"));
  tl.fromTo("#lock", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: ENTER, immediateRender: false }, ws("if it pauses"));
  widen(ws("pauses", 0.4)); price(0.97, ws("can stay"));

  // Closing: the stage fades and the coin returns to its opening size and spot, then everything fades and the card enters.
  // Hold the paused state 1.2 s after the last word, clear the stage, hold the coin alone, then the card.
  const A = L + 1.2, P = L + 3.6;
  tl.to(["#ruler", "#firm", "#issuer"], { opacity: 0, duration: 0.6, ease: EXIT }, A);
  tl.to("#coin", { ...INTRO, duration: 0.9, ease: MOVE }, A + 0.2);
  tl.to(["#coin", "#caps", "#hl"], { opacity: 0, duration: 0.6, ease: EXIT }, P - 0.8);
  tl.fromTo("#kicker", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, P + 0.3);
  tl.fromTo("#handle", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "power4.out" }, P + 0.48);
  tl.fromTo("#socials svg", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.48, ease: ENTER, stagger: 0.1 }, P + 0.98);

  // Captions: split at punctuation, long clauses cut in two before a joining word; only the current word is highlighted.
  const phrases = [], clauses = []; let cur = [];
  WORDS.forEach((w, i) => { cur.push(i); if (/[.,?]$/.test(w.text)) { clauses.push(cur); cur = []; } });
  if (cur.length) clauses.push(cur);
  clauses.forEach((c, k) => { if (c.length < 3 && clauses[k + 1]) { clauses[k + 1].unshift(...c); return; }
    if (c.length <= 7) return phrases.push(c);
    const JOIN = /^(and|or|so|which|from|to|in|like|before)$/i, cost = (j) => Math.abs(j - c.length / 2) - (JOIN.test(WORDS[c[j]].text) ? 2 : 0);
    let cut = 2; for (let j = 2; j <= c.length - 2; j++) if (cost(j) < cost(cut)) cut = j;
    phrases.push(c.slice(0, cut), c.slice(cut)); });
  phrases.forEach((p, pi) => { const d = document.createElement("div"); d.className = "cp"; d.id = "cp" + pi;
    d.innerHTML = p.map((i) => `<span id="w${i}">${WORDS[i].text}</span>`).join(" "); document.querySelector("#caps").append(d); });
  phrases.forEach((p, pi) => { const a = WORDS[p[0]].start, b = WORDS[p.at(-1)].end, nx = phrases[pi + 1] ? WORDS[phrases[pi + 1][0]].start : Infinity;
    tl.set("#cp" + pi, { opacity: 1 }, a); tl.set("#cp" + pi, { opacity: 0 }, nx - b < 0.5 ? nx : b + 0.05);
    p.forEach((i, k) => { const ns = k + 1 < p.length ? WORDS[p[k + 1]].start : Infinity;
      if (ns - WORDS[i].start < 0.1) return; // a word too short to see would flash for one frame
      tl.set("#w" + i, { backgroundColor: "#d19847", color: "#1d2930" }, WORDS[i].start);
      tl.set("#w" + i, { backgroundColor: "rgba(0,0,0,0)", color: "#fcfaf8" }, Math.min(Math.max(WORDS[i].end, WORDS[i].start + 0.1), ns)); }); });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
</script>
