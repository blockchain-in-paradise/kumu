<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Pūpūkahi Tech thumbnail sample</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* One stage: a USDC coin that slides along a price ruler (the ruler names the price), a firm, and the issuer's
     safe with a deposit slot. Coins and dollar bills are carried between them; nothing is joined by lines. */
  @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
  body { margin: 0; background: #0e394e; font-family: "Inter", sans-serif; }
  #root {
    --canvas: #0e394e; --ink: #fcfaf8; --on-highlight: #1d2930; --accent: #39a1ac;
    --highlight: #d19847; --panel: rgba(14,57,78,.72); --border: rgba(252,250,248,.22);
    --support-primary: #196d76; --support-palm: #367d65; --support-sunset: #ee7c2b;
    position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink);
  }
  .ground { position: absolute; inset: 0; overflow: hidden; background: var(--canvas); }
  .ground-photo { position: absolute; inset: 0; opacity: 0.15; background: url("assets/ground.webp") center / cover no-repeat; }
  .clip { position: absolute; inset: 0; }
  .headline { position: absolute; left: 92px; right: 92px; top: 200px; margin: 0;
    font-size: 104px; font-weight: 800; line-height: 0.92; letter-spacing: -0.04em; text-wrap: balance; }

  /* The coin rides the ruler; its center sits over the tick of its price. */
  /* The v1 coin: ridged gold rim, radial gold face, a pressed inner ring, an embossed USDC. */
  #coin { position: absolute; left: 420px; top: 520px; width: 240px; height: 240px; z-index: 4; }
  .coin { position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(#b8860b 0 1.5deg, #e8bb3a 1.5deg 3deg);
    box-shadow: 0 24px 48px rgba(0,0,0,.4); }
  .coin::before { content: ""; position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fff4c8 0%, #f6cf55 22%, #dcaa2a 58%, #a87a14 100%); }
  .coin::after { content: ""; position: absolute; inset: 32px; border-radius: 50%; border: 5px solid rgba(110,72,0,.35);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .coin span { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1;
    font-size: 58px; font-weight: 800; letter-spacing: -0.02em; color: #6b4600; text-shadow: 0 2px 0 rgba(255,236,170,.6); }
  #mini .coin { box-shadow: 0 10px 20px rgba(0,0,0,.4); } #mini .coin::before { inset: 4px; } #mini .coin::after { inset: 13px; border-width: 3px; }
  #mini .coin span { font-size: 21px; }
  #ruler { position: absolute; left: 200px; width: 680px; top: 772px; height: 6px; border-radius: 3px; background: rgba(252,250,248,.45); }
  .tick { position: absolute; top: -14px; width: 4px; height: 34px; margin-left: -2px; border-radius: 2px; background: rgba(252,250,248,.45); }
  .tick b { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); font-size: 40px; font-weight: 600; white-space: nowrap; color: var(--ink); }

  /* The firm and the issuer's safe (cash on top, a deposit slot on the door). */
  #firm { position: absolute; left: 140px; top: 990px; width: 240px; text-align: center; z-index: 2; }
  #firm svg { display: block; width: 240px; height: 290px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.35)); }
  #firm b { display: block; margin: 8px -40px 0; font-size: 40px; font-weight: 600; }
  #issuer { position: absolute; left: 610px; top: 1000px; width: 280px; text-align: center; z-index: 2; }
  #safe { position: relative; width: 250px; height: 281px; margin: 0 auto; }
  #safe .obj { width: 250px; height: 281px; }
  #slot { position: absolute; left: 25%; top: 19%; width: 40%; height: 18px; border-radius: 9px; background: #0b161b;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.5); }
  #cash { position: absolute; left: -72px; top: 160px; width: 160px; z-index: 3; }
  #cash .obj { width: 160px; height: 112px; }
  #issuer > b { display: block; margin-top: 6px; font-size: 40px; font-weight: 600; }
  .lock-row { position: absolute; left: 0; right: 0; top: -38px; display: flex; justify-content: center; z-index: 5; }
  .lock { display: flex; align-items: center; gap: 12px; background: var(--support-sunset); color: var(--on-highlight);
    font-size: 40px; font-weight: 800; padding: 8px 26px; border-radius: 999px; white-space: nowrap; box-shadow: 0 12px 28px rgba(0,0,0,.4); }
  .lock svg { width: 38px; height: 38px; }

  /* Carried items: a small copy of the coin and one dollar bill. */
  #mini { position: absolute; left: 0; top: 0; width: 96px; height: 96px; z-index: 6; }
  #bill { position: absolute; left: 0; top: 0; width: 150px; height: 72px; z-index: 6; overflow: visible; filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); }

  .caps { position: absolute; left: 92px; right: 92px; bottom: 340px; height: 130px; }
  .cp { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 52px; font-weight: 800; line-height: 1.2; opacity: 0; text-wrap: balance; }
  .cp span { padding: 0 8px; border-radius: 8px; }
  .cta-lockup { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0 60px; text-align: center; }
  .cta-kicker { color: var(--highlight); font-size: 45px; font-weight: 800; letter-spacing: 0.18em; }
  .cta-handle { margin: 30px 0 0; color: var(--ink); font-size: 82px; font-weight: 800; line-height: 1; letter-spacing: -0.06em; }
  .socials { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 48px; }
  .socials svg { display: block; width: 94px; height: 94px; flex: 0 0 94px; color: var(--ink); }
</style>
<style>
  /* Cover: the title and a large USDC coin standing on the price ruler at $1.00, inside x 60–960, y 240–1400. */
  .title { position: absolute; left: 92px; right: 120px; top: 270px; margin: 0; font-size: 112px; font-weight: 800; line-height: 0.92; letter-spacing: -0.04em; text-wrap: balance; }
  #coin { left: 330px; top: 640px; width: 420px; height: 420px; }
  #coin .coin span { font-size: 102px; } #coin .coin::after { inset: 56px; border-width: 8px; } #coin .coin::before { inset: 18px; }
  #ruler { top: 1090px; }
  .tick b { font-size: 44px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
  <div class="ground"><div class="ground-photo"></div></div>
  <h1 class="title">Why Stablecoins Stay at $1</h1>
  <div id="ruler">
    <div class="tick" style="left:40px"><b>$0.99</b></div>
    <div class="tick" style="left:340px"><b style="color:#6fd0da;font-weight:800">$1.00</b></div>
    <div class="tick" style="left:640px"><b>$1.01</b></div>
  </div>
  <div id="coin"><div class="coin"><span>USDC</span></div></div>
</div>
<script>window.__timelines = { main: gsap.timeline({ paused: true }) };</script>
</body>
</html>
