<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Pūpūkahi Tech thumbnail sample</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Static cover sample: title (balanced, never broken by hand) and a large hero, no value tag, inside the safe box (x 60–960, y 240–1400). */
  @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
  body { margin: 0; background: #0e394e; font-family: "Inter", sans-serif; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #fcfaf8; }
  .ground { position: absolute; inset: 0; background: #0e394e; }
  .ground-photo { position: absolute; inset: 0; opacity: 0.15; background: url("assets/ground.webp") center / cover no-repeat; }
  .title { position: absolute; left: 92px; right: 92px; top: 270px; margin: 0;
    font-size: 112px; font-weight: 800; line-height: 0.92; letter-spacing: -0.04em; text-wrap: balance; }
  .hero { position: absolute; left: 0; right: 0; top: 640px; bottom: 420px; justify-content: center; display: flex; flex-direction: column; align-items: center; }
  .coin { position: relative; width: 560px; height: 560px; border-radius: 50%;
    background: repeating-conic-gradient(#b8860b 0 1.5deg, #e8bb3a 1.5deg 3deg); box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .coin::before { content: ""; position: absolute; inset: 20px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fff4c8 0%, #f6cf55 22%, #dcaa2a 58%, #a87a14 100%); }
  .coin::after { content: ""; position: absolute; inset: 74px; border-radius: 50%; border: 9px solid rgba(110,72,0,.35); }
  .coin span { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1;
    font-size: 132px; font-weight: 800; color: #6b4600; text-shadow: 0 3px 0 rgba(255,236,170,.6); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
  <div class="ground"><div class="ground-photo"></div></div>
  <h1 class="title">Why Stablecoins Stay at $1</h1>
  <div class="hero"><div class="coin"><span>USDC</span></div></div>
</div>
<script>window.__timelines.main = gsap.timeline({ paused: true });</script>
</body>
</html>
