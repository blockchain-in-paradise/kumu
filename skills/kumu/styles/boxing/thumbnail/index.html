<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Fight night thumbnail sample</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/characters/rig3d.js"></script>
<script src="assets/characters/poses.js"></script>
<style>
  /* Static cover sample: the side view at the start, the title alone under the fighters, inside the safe box
     (x 60–960, y 240–1400). */
  @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
  body { margin: 0; background: #110e0c; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #f6f3ee; font-family: "Inter", sans-serif;
    background: radial-gradient(ellipse 70% 42% at 50% 34%, #241d17, #110e0c 72%); }
  .beam { position: absolute; left: 0; right: 0; top: -40px; height: 1300px; clip-path: polygon(40% 0, 60% 0, 92% 100%, 8% 100%);
    background: linear-gradient(rgba(255,232,190,.10), rgba(255,232,190,.03) 70%, transparent); filter: blur(30px); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, transparent 48%, rgba(0,0,0,.7) 100%); }
  #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .card { position: absolute; left: 60px; right: 60px; top: 1060px; text-align: center; }
  .card h1 { margin: 0; font-weight: 800; font-size: 124px; line-height: 1.02; letter-spacing: -.02em; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
  <div class="beam"></div>
  <svg id="stage"></svg>
  <div class="vignette"></div>
  <div class="card"><h1>The pull counter</h1></div>
</div>
<script>
  const stage = SportsRig.stage(document.getElementById("stage"), { camera: { cy: 470 } });
  const you = SportsRig.mount(stage, SportsRig.LOOKS.red, { x: -157, facing: 0 });
  const rival = SportsRig.mount(stage, SportsRig.LOOKS.blue, { x: 157, facing: 180 });
  SportsRig.face(you, rival);
  stage.render();
  window.__timelines.main = gsap.timeline({ paused: true });
</script>
</body>
</html>
